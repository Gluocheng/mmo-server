# 本地预发布栈：NATS + 五服务
# MySQL/Redis 使用本机或已有 Docker 容器暴露到宿主机的 3306/6379。
# 用法见 README「本地 Docker CI/CD」与 scripts/cicd.ps1

name: mmo-server

services:
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped

  import-config:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/import-config
      - -profile=/app/configs/mmo-docker.json
      - -data-dir=/app/gameconfig/gen/data
    restart: "no"

  master:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/master
      - -path=/app/configs/mmo-docker.json
      - -node=master-1
    depends_on:
      nats:
        condition: service_started
      import-config:
        condition: service_completed_successfully
    restart: unless-stopped

  login:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/login
      - -path=/app/configs/mmo-docker.json
      - -node=login-1
    depends_on:
      master:
        condition: service_started
    restart: unless-stopped

  login2:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/login
      - -path=/app/configs/mmo-docker.json
      - -node=login-2
    depends_on:
      master:
        condition: service_started
    restart: unless-stopped

  game:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/game
      - -path=/app/configs/mmo-docker.json
      - -node=10001
    depends_on:
      master:
        condition: service_started
      login:
        condition: service_started
      import-config:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/gateway
      - -path=/app/configs/mmo-docker.json
      - -node=gate-1
    depends_on:
      game:
        condition: service_started
      login:
        condition: service_started
      login2:
        condition: service_started
    restart: unless-stopped

  gateway2:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/gateway
      - -path=/app/configs/mmo-docker.json
      - -node=gate-2
    depends_on:
      game:
        condition: service_started
      login:
        condition: service_started
      login2:
        condition: service_started
    restart: unless-stopped

  gate-entry:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/gate-entry
      - -path=/app/configs/mmo-docker.json
    ports:
      - "10100:10100"
    sysctls:
      net.core.somaxconn: "4096"
    depends_on:
      gateway:
        condition: service_started
      gateway2:
        condition: service_started
    restart: unless-stopped

  loadtest:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    profiles: ["load"]
    command:
      - /app/lt-scale
      - -addr=gate-entry:10100
    depends_on:
      gate-entry:
        condition: service_started
    restart: "no"

  # Web 控制台：http://127.0.0.1:${GM_HTTP_PORT:-19080}/  默认 admin / admin123
  gm:
    image: mmo-server:${MMO_IMAGE_TAG:-local}
    command:
      - /app/gm
      - -http=:9080
      - -nats=nats://nats:4222
      - -prefix=mmo
      - -game=10001
      - -login=login-1
      - -path=/app/configs/mmo-docker.json
      - -token=dev-gm-token
    environment:
      GM_BOOTSTRAP_USER: admin
      GM_BOOTSTRAP_PASSWORD: admin123
      GM_HTTP_TOKEN: dev-gm-token
    ports:
      - "${GM_HTTP_PORT:-19080}:9080"
    depends_on:
      game:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped
