syntax = "proto3";

package mmo.protocol.v1;

option go_package = "github.com/example/mmo-server/internal/protocolpb/gen;protocolpb";

// CombatCastRequest 释放技能。点名技能要填 target_uid；自身圆心技能忽略目标。
message CombatCastRequest {
  int32 skill_id = 1 [json_name = "skillId"];
  int64 target_uid = 2 [json_name = "targetUid"];
}

// CombatHit 一拍内的一次命中或跳伤/治疗。
message CombatHit {
  int64 source_uid = 1 [json_name = "sourceUid"];
  int64 target_uid = 2 [json_name = "targetUid"];
  int32 skill_id = 3 [json_name = "skillId"];
  int32 buff_id = 4 [json_name = "buffId"];
  int32 amount = 5 [json_name = "amount"];
  bool heal = 6 [json_name = "heal"];
  int32 target_hp = 7 [json_name = "targetHp"];
  bool dead = 8 [json_name = "dead"];
}

// CombatFrame 一名观众这一拍要看到的战斗事件，每拍最多一条。
message CombatFrame {
  repeated CombatHit hits = 1 [json_name = "hits"];
  bool truncated = 2 [json_name = "truncated"];
}
