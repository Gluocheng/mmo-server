syntax = "proto3";

package mmo.protocol.v1;

import "bag.proto";

option go_package = "github.com/example/mmo-server/internal/protocolpb/gen;protocolpb";

// KillRewardItem 是一次击杀结算里发给自己的一条道具。pending 为 true 时进了待领取。
message KillRewardItem {
  int32 item_id = 1 [json_name = "itemId"];
  int32 count = 2 [json_name = "count"];
  bool pending = 3 [json_name = "pending"];
}

// KillSettle 推给本线造成过伤害的玩家。class 为 solo、party 或 open。没有名次时 rank 为 0。
message KillSettle {
  int64 monster_uid = 1 [json_name = "monsterUid"];
  int32 monster_id = 2 [json_name = "monsterId"];
  string class = 3 [json_name = "class"];
  int32 rank = 4 [json_name = "rank"];
  int64 last_hit_uid = 5 [json_name = "lastHitUid"];
  repeated KillRewardItem items = 6 [json_name = "items"];
}

// RewardClaim 是背包放不下时留下的一条待领取。
message RewardClaim {
  int64 id = 1 [json_name = "id"];
  int32 item_id = 2 [json_name = "itemId"];
  int32 count = 3 [json_name = "count"];
  string reason = 4 [json_name = "reason"];
  int32 monster_id = 5 [json_name = "monsterId"];
}

// RewardListResponse 是当前角色的待领取列表。
message RewardListResponse {
  repeated RewardClaim claims = 1 [json_name = "claims"];
}

// RewardTakeRequest 领取一条待领取。
message RewardTakeRequest {
  int64 claim_id = 1 [json_name = "claimId"];
}

// RewardTakeResponse 是删掉待领取之后的背包。
message RewardTakeResponse {
  BagListResponse bag = 1 [json_name = "bag"];
}

// RewardDeliverRequest 击杀奖励发放请求（combat/reward → bag 跨 Actor）。
message RewardDeliverRequest {
  int64 player_id = 1 [json_name = "playerId"];
  int32 item_id = 2 [json_name = "itemId"];
  int32 count = 3 [json_name = "count"];
  int32 monster_id = 4 [json_name = "monsterId"];
}

// RewardDeliverResponse 击杀奖励发放结果。placed 为 false 时整份进了待领取。
message RewardDeliverResponse {
  bool placed = 1 [json_name = "placed"];
  int32 bag_type = 2 [json_name = "bagType"];
  int64 claim_id = 3 [json_name = "claimId"];
  BagListResponse bag = 4 [json_name = "bag"];
}

// RewardClaimRequest 领取待领取请求（reward → bag 跨 Actor）。
message RewardClaimRequest {
  int64 player_id = 1 [json_name = "playerId"];
  int64 claim_id = 2 [json_name = "claimId"];
}

// RewardClaimResponse 领取待领取结果（含最新背包）。
message RewardClaimResponse {
  int32 bag_type = 1 [json_name = "bagType"];
  BagListResponse bag = 2 [json_name = "bag"];
}
